[project]
name = "rag-interview-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-docx>=1.1",
  "pydantic>=2.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
